name: calendar

# Redraws the 3D contribution calendar every morning and publishes it to the
# `output` branch, so the bot never adds commits to main.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/calendar.mjs calendar.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
      - name: Publish to output
        run: |
          mkdir out && mv calendar.svg out/ && cd out
          git init -q -b output
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add calendar.svg && git commit -qm "calendar"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" output
