name: snake

# Regenerates the contribution-grid snake every morning, plus on demand and on
# every push to main so a palette change shows up immediately instead of waiting
# for the next cron tick.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # The action commits the generated SVGs to the `output` branch, so the job
    # token needs write access. Declaring it here beats relying on the repo-wide
    # "Read and write permissions" toggle being set.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # Runs BEFORE the snake on purpose. Platane/snk is a Docker action running
      # as root, so it creates dist/ owned by root and this step (running as the
      # `runner` user) then fails with EACCES. Creating dist/ here first means it
      # belongs to runner, and root can still write into it afterwards.
      #
      # Self-hosted because the shared github-readme-stats instance returns 503
      # often enough to leave broken images on the profile.
      - name: Generate stats card
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Greyscale, matching the header and the stats card. Not GitHub
          # green, and no longer the warm ramp either: the profile reads as one
          # black-and-white system, and colour is reserved for the renders.
          # color_dots takes exactly 5 stops: zero contributions -> highest.
          outputs: |
            dist/snake-dark.svg?color_snake=#f5f4f1&color_dots=#0d0d0c,#2b2a27,#4f4d49,#8b8984,#e8e6e1
            dist/snake-light.svg?color_snake=#1a1a18&color_dots=#f2f2ef,#d5d4d0,#a7a5a0,#6d6b66,#1a1a18

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
