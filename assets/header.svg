<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Myan Patel — building AI products, then breaking them on purpose">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1815"/>
      <stop offset="55%" stop-color="#17130f"/>
      <stop offset="100%" stop-color="#120f0c"/>
    </linearGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <radialGradient id="ember">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moss">
      <stop offset="0%" stop-color="#7ea24f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7ea24f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberO">
      <stop offset="0%" stop-color="#c98a2b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c98a2b" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="typeClip">
      <rect x="64" y="176" width="0" height="34">
        <animate attributeName="width" values="0;0;560;560;0" keyTimes="0;0.06;0.45;0.93;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <style>
      .n  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
      .nm { font-size: 74px; font-weight: 700; letter-spacing: -2.5px; fill: #f2ece2; }
      .tp { font-size: 25px; fill: #d9cfc2; }
      .mt { font-size: 17px; fill: #8e8779; letter-spacing: 0.5px; }
      .kw { fill: #d97757; }
      .cm { fill: #6f6a60; }
      .cur { fill: #d97757; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .cur { animation: blink 1.05s steps(1) infinite; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(34px,-22px) } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-28px,18px) } }
      @keyframes drift3 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(18px,26px) } }
      .o1 { animation: drift1 15s ease-in-out infinite; }
      .o2 { animation: drift2 19s ease-in-out infinite; }
      .o3 { animation: drift3 23s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#sky)"/>

  <g filter="url(#soft)">
    <circle class="o1" cx="1006" cy="96"  r="80" fill="url(#ember)"/>
    <circle class="o2" cx="1112" cy="196" r="66" fill="url(#moss)"/>
    <circle class="o3" cx="905"  cy="205" r="54" fill="url(#amberO)"/>
  </g>

  <rect width="1200" height="280" filter="url(#grain)" opacity="0.05"/>

  <rect x="0" y="0" width="5" height="280" fill="#d97757"/>

  <text class="n mt" x="64" y="66">MYANPTL</text>
  <text class="n nm" x="64" y="140">Myan Patel</text>

  <g clip-path="url(#typeClip)">
    <text class="n tp" x="64" y="202"><tspan class="kw">const</tspan> focus = <tspan class="cm">'GenAI product x AI security'</tspan></text>
  </g>
  <rect class="cur" x="64" y="180" width="12" height="27">
    <animate attributeName="x" values="64;64;626;626;64" keyTimes="0;0.06;0.45;0.93;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <text class="n mt" x="64" y="248">Westford Academy 2028  ·  Boston, MA  ·  shipping since 15</text>
</svg>
